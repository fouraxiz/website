# /etc/nginx/sites-available/fouraxiz.conf
# Replace fouraxiz.com with your domain, then run certbot (see deploy/DEPLOY.md).

upstream fouraxiz_web {
    server 127.0.0.1:3000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name fouraxiz.com www.fouraxiz.com;

    client_max_body_size 10m;   # image uploads (app limit is 8 MB)

    # Uploaded images straight from disk (faster than going through Node).
    location /uploads/ {
        alias /opt/fouraxiz-website/deploy/data/uploads/;
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options nosniff;
        location ~* \.svg$ {
            add_header Content-Security-Policy "default-src 'none'; style-src 'unsafe-inline'; sandbox";
            add_header X-Content-Type-Options nosniff;
        }
    }

    location /_next/static/ {
        proxy_pass http://fouraxiz_web;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        proxy_pass http://fouraxiz_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
    }
}
